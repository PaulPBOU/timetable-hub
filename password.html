<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Enter password</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f5f6f8; color: #172033; font-family: system-ui, sans-serif; }
        main { width: 100%; max-width: 340px; }
        h1 { margin: 0 0 24px; font-size: 26px; font-weight: 650; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        input, button { width: 100%; min-height: 48px; border-radius: 8px; font: inherit; }
        input { padding: 12px; border: 1px solid #aab1bf; background: white; color: #172033; }
        input:focus-visible, button:focus-visible { outline: 3px solid #818cf8; outline-offset: 3px; }
        input[aria-invalid="true"] { border-color: #b42318; }
        button { margin-top: 16px; padding: 12px; border: 0; background: #27344d; color: white; font-weight: 600; cursor: pointer; }
        button:hover { background: #18243a; }
        .note { color: #5b6473; font-size: 13px; line-height: 1.5; }
        #password-error { min-height: 20px; margin: 10px 0 0; color: #b42318; font-size: 14px; }
    </style>
    <script src="site-access.js" defer></script>
</head>
<body>
    <main>
        <h1>Enter password</h1>
        <form id="password-form">
            <label for="password">Password</label>
            <input id="password" type="password" inputmode="numeric" autocomplete="current-password" aria-describedby="password-error" required autofocus>
            <button type="submit">Unlock</button>
            <p id="password-error" role="alert" aria-live="polite"></p>
        </form>
        <p class="note">This browser will remember you.</p>
        <noscript><p>Enable JavaScript to unlock this site.</p><style>#password-form { display: none; }</style></noscript>
    </main>
</body>
</html>
